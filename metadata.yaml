name: astrbot_plugin_comfyui_anima # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: ComfyUI萌绘 # 用于展示的名字
desc: 通过指令或 AI 对话调用 ComfyUI 绘图，支持多服务器、多工作流、LoRA 管理与 Anima 标签翻译。 # 插件简短描述
short_desc: 调用 ComfyUI 绘图，支持多服务器、多工作流、LoRA 与 Anima 标签翻译。 # 插件市场卡片短描述
version: v5.6.41 # 插件版本号
author: windExplorer # 作者（须与插件市场源的 author 一致，即 GitHub 用户名）
author_url: https://github.com/windExplorer # 作者主页
repo: https://github.com/windExplorer/astrbot-comfyui-anima # 插件的仓库地址
category: AI 增强 # 插件市场分类
tags: # 插件市场标签
  - 绘图
  - ComfyUI
  - 生图
  - LoRA
  - Anima
astrbot_version: ">=4.22.0" # 要求的 AstrBot 版本范围
support_platforms: # 支持的适配器平台
  - aiocqhttp
  - qq_official

# 插件 WebUI 页面：AstrBot 自动把 pages/<name>/index.html 挂载到
# /pages/<插件名>/<name>/，后端 API 通过 context.register_web_api 注册。
# 注意：AstrBot 按 pages/ 目录扫描顺序决定默认页（首目录为默认入口），
# 因此新版目录 anima-console-vue 字典序在前作为默认，旧版目录名刻意排在其后。
pages:
  - name: anima-console-vue
    title: 萌绘控制台
  - name: anima-console-vue-legacy
    title: 萌绘控制台 (旧版)
